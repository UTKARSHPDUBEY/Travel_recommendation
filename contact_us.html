<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us — TravelBloom</title>
    <link rel="stylesheet" href="travel_recommendation.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="logo">Travel<span>Bloom</span></div>
        <nav class="main-nav">
          <a href="travel_recommendation.html">Home</a>
          <a href="about_us.html">About Us</a>
          <a href="contact_us.html" class="active">Contact Us</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="overlay"></div>
      <section class="contact-hero">
        <div class="container contact-layout">
          <div class="contact-copy-panel">
            <div class="aside-bar"></div>
            <div>
              <h1 class="contact-heading">CONTACT US</h1>
              <p class="contact-subtitle">Get in touch</p>
            </div>
          </div>

          <div class="contact-card">
            <form class="contact-form">
              <label for="name">Name</label>
              <input id="name" type="text" placeholder="Enter your name" required />

              <label for="email">Email</label>
              <input id="email" type="email" placeholder="Enter your email" required />

              <label for="message">Message</label>
              <textarea id="message" rows="6" placeholder="Write your message"></textarea>

              <button type="submit" class="btn submit-btn">Submit</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">&copy; 2026 TravelBloom</div>
    </footer>
  </body>
</html>
